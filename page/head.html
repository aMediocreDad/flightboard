<title>Flightboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #f6f4ee;
    --surface: #fdfcf8;
    --surface2: #efece2;
    --ink: #201d16;
    --ink2: #57513f;
    --muted: #7d7663;
    --line: #e0dbcc;
    --accent: #8f6400;
    --critical: #b3261e;
    --critical-bg: #f9e9e7;
    --active: #2f6b3a;
    --active-bg: #e8f0e6;
    --hold: #8a6a1f;
    --hold-bg: #f4edd9;
    --dead: #7d7663;
    --dead-bg: #eae7db;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16140f; --surface: #1e1b13; --surface2: #262217;
      --ink: #eae5d6; --ink2: #beb69f; --muted: #968e78; --line: #322d1f;
      --accent: #e2a71e;
      --critical: #ff8276; --critical-bg: #35201d;
      --active: #83c98f; --active-bg: #1e2b1e;
      --hold: #d9b04a; --hold-bg: #2e2817;
      --dead: #968e78; --dead-bg: #24211a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #16140f; --surface: #1e1b13; --surface2: #262217;
    --ink: #eae5d6; --ink2: #beb69f; --muted: #968e78; --line: #322d1f;
    --accent: #e2a71e;
    --critical: #ff8276; --critical-bg: #35201d;
    --active: #83c98f; --active-bg: #1e2b1e;
    --hold: #d9b04a; --hold-bg: #2e2817;
    --dead: #968e78; --dead-bg: #24211a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.5; margin: 0;
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 62rem; margin: 0 auto; }
  .mono, code, .chip, .tile, h1, h2, th, .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  header { border-bottom: 3px solid var(--accent); padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .eyebrow { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; }
  h1 { font-size: 1.7rem; font-weight: 600; letter-spacing: .04em; margin: .15rem 0 .3rem; text-wrap: balance; }
  h1 .fav { margin-right: .4rem; }
  h2 { font-size: .95rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin: 2.4rem 0 .8rem; }
  h2 a { color: inherit; text-decoration: none; }
  h2 .count { color: var(--muted); font-weight: 400; margin-left: .4rem; }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
  }
  .tiles { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  .tile {
    flex: 1 1 8.5rem; min-width: 8.5rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px;
    padding: .6rem .8rem; text-decoration: none; color: var(--ink);
  }
  .tile .n { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; display: block; }
  .tile .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .tile.critical .n { color: var(--critical); }
  .tile.active .n { color: var(--active); }
  .tile.hold .n { color: var(--hold); }
  .tile.dead .n { color: var(--dead); }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--critical); border-radius: 6px;
    padding: .9rem 1.1rem; margin-bottom: .9rem;
  }
  .card h3 { margin: 0 0 .25rem; font-size: 1.02rem; font-weight: 600; }
  .card .meta { font-size: .8rem; color: var(--muted); margin-bottom: .4rem; }
  .card p { margin: .35rem 0; color: var(--ink2); }
  .chip {
    display: inline-block; font-size: .68rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em;
    padding: .1rem .5rem; border-radius: 999px; white-space: nowrap;
  }
  .chip.critical { color: var(--critical); background: var(--critical-bg); }
  .chip.active { color: var(--active); background: var(--active-bg); }
  .chip.hold { color: var(--hold); background: var(--hold-bg); }
  .chip.dead { color: var(--dead); background: var(--dead-bg); }
  code {
    background: var(--surface2); border-radius: 4px;
    padding: .1rem .35rem; font-size: .82rem;
  }
  pre {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 6px;
    padding: .65rem .8rem; overflow-x: auto; margin: .5rem 0 0;
  }
  pre code { background: none; padding: 0; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th {
    text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 500; padding: .55rem .8rem;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: .5rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.date { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink2); }
  td .path { font-size: .76rem; color: var(--muted); display: block; }
  details {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: .55rem .9rem; margin-bottom: .6rem;
  }
  summary { cursor: pointer; font-weight: 500; font-size: .88rem; }
  summary .count { color: var(--muted); }
  details ul { margin: .5rem 0 .3rem; padding-left: 1.2rem; color: var(--ink2); font-size: .85rem; }
  details li { margin-bottom: .2rem; }
  .note { color: var(--muted); font-size: .84rem; margin: .4rem 0 0; }
  .foot { margin-top: 2.6rem; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--line); padding-top: .8rem; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
<div class="wrap">
